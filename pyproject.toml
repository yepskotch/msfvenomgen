[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "msfvenomgen"
version = "1.0.6"
description = "Interactive msfvenom payload generator"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
msfvenomgen = "msfvenomgen:main"
